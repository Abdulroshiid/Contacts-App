<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <h1>Forgot password?</h1>
        <p class="auth-help">
          Enter the email linked to your account and we will prepare a secure
          reset link.
        </p>

        <form id="forgotPasswordForm" novalidate>
          <div class="form-group" id="emailGroup">
            <label for="email">Email address</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address..." />
            </div>
            <p class="field-error" id="emailError"></p>
          </div>

          <button type="submit" class="btn-primary">Send reset link</button>
        </form>

        <div id="statusBanner" class="alert" role="status"></div>

        <div id="resetLinkPanel" class="reset-link-panel hidden">
          <p>Use this link to continue:</p>
          <a id="resetLink" href="#"></a>
          <div class="modal-actions">
            <a id="continueResetBtn" href="#" class="btn-secondary"
              >Continue to reset</a
            >
          </div>
        </div>

        <p class="form-footer">
          <a href="index.html">Back to login</a>
        </p>
      </div>
    </div>

    <script src="auth.js"></script>
    <script src="forgot-password.js"></script>
  </body>
</html>
