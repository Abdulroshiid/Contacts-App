<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact App Login Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <h1>Login</h1>
        <form id="loginForm" novalidate>
          <div class="form-group" id="usernameGroup">
            <label for="username">Username or Email</label>
            <div class="input-icon-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username or email here..." />
            </div>
            <p class="field-error" id="usernameError"></p>
          </div>
          <div class="form-group" id="passwordGroup">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password here..." />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword(event, 'password')">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <p class="field-error" id="passwordError"></p>
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>

        <div class="divider">
          <span>OR</span>
        </div>

        <a href="/api/auth/google" class="btn-google">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Login with Google
        </a>

        <p class="form-footer">
          Don't have an account? <a href="signup.html">Sign up here</a>
        </p>
      </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Login Error</h2>
        <p id="errorMessage"></p>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeErrorModal()">
            Try Again
          </button>
          <a href="signup.html" class="btn-primary">Create Account</a>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
