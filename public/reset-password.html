<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <h1>Reset password</h1>
        <p class="auth-help">Choose a new password for your account.</p>

        <form id="resetPasswordForm" novalidate>
          <div class="form-group" id="passwordGroup">
            <label for="password">New password</label>
            <div class="password-input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your new password..." />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword(event, 'password')">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <p class="field-error" id="passwordError"></p>
          </div>

          <div class="form-group" id="confirmPasswordGroup">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter your password..." />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword(event, 'confirmPassword')">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <p class="field-error" id="confirmPasswordError"></p>
          </div>

          <button type="submit" class="btn-primary">Save new password</button>
        </form>

        <div id="statusBanner" class="alert" role="status"></div>

        <p class="form-footer">
          <a href="index.html">Back to login</a>
        </p>
      </div>
    </div>

    <script src="auth.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
